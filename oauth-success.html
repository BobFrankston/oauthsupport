<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorization Successful</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .card {
            background: white;
            padding: 2rem 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 {
            color: #22c55e;
            margin: 0 0 0.5rem 0;
        }

        p {
            color: #666;
            margin: 0.5rem 0;
        }

        .countdown {
            font-size: 0.9rem;
            color: #999;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>&#10003; Authorization Successful</h1>
        <p>You can close this window now.</p>
        <p class="countdown" id="countdown">Closing automatically...</p>
    </div>
    <script>
        (function () {
            setTimeout(function () {
                window.close();
                window.open('', '_self').close();
                // Browser blocked close — update the message
                setTimeout(function () {
                    document.getElementById('countdown').textContent = 'Done — you can close this tab.';
                }, 300);
            }, 1000);
        })();
    </script>
</body>

</html>
